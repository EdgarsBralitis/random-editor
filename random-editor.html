<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Random Transformed Text Editor</title>
  <style>
    body {
      font-family: monospace;
      background: #111;
      color: white;
      padding: 20px;
    }

    #editor {
      width: 100%;
      min-height: 200px;
      border: 2px solid #444;
      padding: 10px;
      background: #222;
      outline: none;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    span.char {
      display: inline-block;
      transition: transform 0.3s ease;
    }
  </style>
</head>
<body>

<h2>Random Transformed Text Editor</h2>
<div id="editor" contenteditable="true"></div>

<script>
  const editor = document.getElementById('editor');

  editor.addEventListener('keydown', (e) => {
    // Allow special keys (Enter, Backspace, arrows, etc.)
    if (e.key === "Enter") {
      e.preventDefault();
      const br = document.createElement("br");
      insertAtCaret(br);
      return;
    }

    if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
      e.preventDefault();

      const char = e.key;

      // Create character span
      const span = document.createElement('span');
      span.classList.add('char');
      span.textContent = char;

      const rotation = Math.floor(Math.random() * 181);
      const mirror = -1 //Math.random() < 0.5 ? -1 : 1;

      span.style.transform = `rotate(${rotation}deg) scaleX(${mirror})`;

      // Create space span
      const space = document.createElement('span');
      space.classList.add('char');
      space.innerHTML = '&nbsp;';
      space.style.display = 'inline-block';
      space.style.width = '0.5em';

      // Insert both
      insertAtCaret(span);
      insertAtCaret(space);
    }
  });

  function insertAtCaret(node) {
    const sel = window.getSelection();
    if (!sel.rangeCount) return;

    const range = sel.getRangeAt(0);
    range.deleteContents();
    range.insertNode(node);

    const newRange = document.createRange();
    newRange.setStartAfter(node);
    newRange.setEndAfter(node);
    sel.removeAllRanges();
    sel.addRange(newRange);
  }
</script>

</body>
</html>
