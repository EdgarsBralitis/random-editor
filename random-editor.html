<script>
  const editor = document.getElementById('editor');

  editor.addEventListener('keydown', (e) => {
    // Only process visible characters (a-z, numbers, symbols)
    if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
      e.preventDefault();

      const char = e.key;

      // Create character span
      const span = document.createElement('span');
      span.classList.add('char');
      span.textContent = char;

      const rotation = Math.floor(Math.random() * 181);
      const mirror = Math.random() < 0.5 ? -1 : 1;

      span.style.transform = `rotate(${rotation}deg) scaleX(${mirror})`;

      // Create space span
      const space = document.createElement('span');
      space.classList.add('char');
      space.innerHTML = '&nbsp;';
      space.style.display = 'inline-block';
      space.style.width = '0.5em';

      // Insert both
      insertAtCaret(span);
      insertAtCaret(space);
    }
    // Allow Enter, Backspace, etc. to work normally
  });

  function insertAtCaret(node) {
    const sel = window.getSelection();
    if (!sel.rangeCount) return;

    const range = sel.getRangeAt(0);
    range.deleteContents();
    range.insertNode(node);

    const newRange = document.createRange();
    newRange.setStartAfter(node);
    newRange.setEndAfter(node);
    sel.removeAllRanges();
    sel.addRange(newRange);
  }
</script>
